<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Red Flag AI Pro</title>
  <style>
    body { width: 320px; font-family: -apple-system, system-ui, sans-serif; background: #0A1628; color: #F4F1EA; margin: 0; padding: 16px; }
    h1 { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #E5484D; margin: 0 0 12px; }
    .score { font-size: 36px; font-weight: 700; margin: 0 0 4px; }
    .risk { font-size: 12px; color: rgba(244,241,234,0.55); margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.05em; }
    .flag { background: #0D1B2E; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 12px; }
    .flag-cat { font-weight: 700; color: #ff9b9e; margin-bottom: 3px; }
    .empty { font-size: 12px; color: rgba(244,241,234,0.45); line-height: 1.6; }
    .error { font-size: 12px; color: #ff9b9e; line-height: 1.6; }
    a { color: #E5484D; text-decoration: none; font-size: 11px; }
    .footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <h1>Red Flag AI Pro</h1>
  <div id="content"><p class="empty">Select text on any page, right-click, and choose &quot;Scan selection with Red Flag AI Pro&quot;.</p></div>
  <div class="footer"><a href="options.html" target="_blank">Set API key →</a></div>
  <script src="popup.js"></script>
</body>
</html>
