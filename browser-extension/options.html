<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Red Flag AI Pro — Options</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0A1628; color: #F4F1EA; margin: 0; padding: 32px; max-width: 480px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; color: rgba(244,241,234,0.6); line-height: 1.6; }
    a { color: #E5484D; }
    input { width: 100%; box-sizing: border-box; background: #0D1B2E; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 10px 12px; color: white; font-size: 13px; margin: 12px 0; }
    button { background: #E5484D; color: white; border: none; border-radius: 9999px; padding: 10px 24px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .saved { color: #4ade80; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Red Flag AI Pro API key</h1>
  <p>Create a key at <a href="https://www.redflagaipro.com/settings" target="_blank">redflagaipro.com/settings → API Keys</a>, then paste it here. Stored locally in your browser via chrome.storage.sync, never sent anywhere except redflagaipro.com.</p>
  <input id="apiKey" type="text" placeholder="rfp_..." />
  <button id="save">Save</button>
  <p id="status" class="saved" style="display:none">Saved.</p>
  <script src="options.js"></script>
</body>
</html>
